<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Sunglasses Collection</title>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <header class="bg-gray-100 shadow-md mb-5">
      <div class="max-w-7xl mx-auto py-6 px-4 text-center">
        <h1 class="text-4xl font-extrabold text-gray-800">
          Sunglasses Collection
        </h1>
        <p class="mt-2 text-gray-600 text-lg">

        </p>
      </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
      <div
        id="products"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8"
      ></div>

      <div id="errorProducts" class="text-center text-red-600 mt-6"></div>

    <script src="sunglasses.js"></script>
